name: Client CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run tests
        run: pnpm test

      - name: Run assistant platform tests
        run: pnpm test:assistant-platform

      - name: Run on-device analytics tests
        run: pnpm test:analytics

      - name: Run goal mode tests
        run: pnpm test:goal-mode

      - name: Reject high-severity production dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: Build application
        run: pnpm build

      - name: Verify generated notices are committed
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.md

  native-sandbox:
    name: Native sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Grant CI Python runtime read access to AppContainers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # On this disposable runner only. The client never changes installed runtime ACLs.
          $runtime = Split-Path (Get-Command python.exe).Source
          icacls $runtime /grant '*S-1-15-2-1:(OI)(CI)RX' /T /Q
          if ($LASTEXITCODE -ne 0) { throw 'Unable to grant CI Python runtime access' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sandbox
