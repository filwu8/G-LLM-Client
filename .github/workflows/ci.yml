name: Client CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # Pin one store for install and the licence inventory, and never restore it
      # from the Actions cache. pnpm records per-package metadata under
      # <store>/v10/index only when it downloads and unpacks a tarball; a cached
      # store comes back with the contents but without that index, and
      # `pnpm licenses list` then fails with ERR_PNPM_MISSING_PACKAGE_INDEX_FILE.
      # A forced relink does not help: pnpm sees the files and skips the download.
      npm_config_store_dir: ${{ github.workspace }}/../pnpm-store

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run tests
        run: pnpm test

      - name: Run Workspace Agent stream and continuation tests
        run: pnpm test:workspace-agent-stream

      - name: Run Workspace Agent completion and document-reader guardrails
        run: pnpm test:workspace-agent-guardrails

      - name: Run assistant platform tests
        run: pnpm test:assistant-platform

      - name: Run on-device analytics tests
        run: pnpm test:analytics

      - name: Run goal mode tests
        run: pnpm test:goal-mode

      - name: Reject dependency advisories at every severity
        run: pnpm audit --audit-level low

      - name: Build application
        id: build
        shell: bash
        run: pnpm build 2>&1 | tee build.log
      - name: Report build failures
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: node scripts/report-tap-failures.mjs build.log

      - name: Verify generated notices are committed
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Test account authorization and fail-closed Linux credential storage
        run: xvfb-run -a pnpm test:gllm-account

  native-sandbox:
    name: Native sandbox (${{ matrix.os }})
    env:
      # Pin one store for install and the licence inventory, and never restore it
      # from the Actions cache. pnpm records per-package metadata under
      # <store>/v10/index only when it downloads and unpacks a tarball; a cached
      # store comes back with the contents but without that index, and
      # `pnpm licenses list` then fails with ERR_PNPM_MISSING_PACKAGE_INDEX_FILE.
      # A forced relink does not help: pnpm sees the files and skips the download.
      npm_config_store_dir: ${{ github.workspace }}/../pnpm-store
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.13.0
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Grant CI Python runtime read access to AppContainers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # On this disposable runner only. The client never changes installed runtime ACLs.
          $runtime = Split-Path (Get-Command python.exe).Source
          icacls $runtime /grant '*S-1-15-2-1:(OI)(CI)RX' /T /Q
          if ($LASTEXITCODE -ne 0) { throw 'Unable to grant CI Python runtime access' }
      - run: pnpm install --frozen-lockfile
      - name: Run sandbox tests
        shell: bash
        run: pnpm test:sandbox 2>&1 | tee sandbox-tests.log
      # Reporting lives in its own step on purpose. `shell: bash` runs the script below
      # with `-e -o pipefail`, so a failing pipeline aborts it before any handler written
      # into that same script can run. That is exactly why the first attempt at this
      # produced no annotations and a red build still said only "exit code 1".
      - name: Report sandbox test failures
        if: failure()
        shell: bash
        run: node scripts/report-tap-failures.mjs sandbox-tests.log
      - name: Test host context, data migration and desktop authorization
        run: node --test --experimental-strip-types src/main/hostEnvironment.test.ts src/main/dataDirectoryCopy.test.ts src/main/desktopToolPolicy.test.ts src/main/computerCommand.test.ts
      - name: Test browser interaction in Electron
        if: runner.os != 'Linux'
        run: node scripts/test-agent-browser.mjs
      - name: Test automatic workspaces and verified data migration
        if: runner.os != 'Linux'
        run: pnpm test:storage
      - name: Test project files and assistant configuration
        if: runner.os != 'Linux'
        run: pnpm test:workspace-experience
      - name: Build and test account sign-in with OS credential persistence
        id: account-tests
        if: runner.os != 'Linux'
        shell: bash
        run: (pnpm build && pnpm test:gllm-account) 2>&1 | tee account-tests.log
      # Same reason as the sandbox job: the build can fail before any TAP is written,
      # and job logs need admin rights, so publish the tail as an annotation instead.
      - name: Report account test failures
        if: failure() && steps.account-tests.outcome == 'failure'
        shell: bash
        run: node scripts/report-tap-failures.mjs account-tests.log
      - name: Test browser interaction in Electron (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-agent-browser.mjs
      - name: Test automatic workspaces and verified data migration (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:storage
      - name: Test project files and assistant configuration (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:workspace-experience
