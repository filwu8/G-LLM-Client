allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64

overrides:
  '@xmldom/xmldom': 0.8.15
  dompurify: 3.4.12
  fast-uri: 3.1.7
  js-yaml: 4.3.2
  undici: 7.29.1

# Slow down newly published packages long enough for common registry incidents to
# be detected, reject transitive git/tarball sources, and prevent provenance
# downgrades during dependency updates.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
