allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64

overrides:
  '@xmldom/xmldom': 0.8.15
  dompurify: 3.4.16
  fast-uri: 3.1.8
  js-yaml: 4.3.2
  # KaTeX 0.18.2 fixes inherited trust options; regression coverage lives in dependencySecurity.test.ts.
  katex: 0.18.2
  # argparse 2 retains Mammoth's legacy CLI aliases and removes the unpatched sprintf-js chain.
  'mammoth>argparse': 2.0.1
  undici: 7.29.1
  # Remove the legacy got/cache and global-agent/sprintf-js download chains.
  '@electron/get': 5.1.0
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  tar: 7.5.22
  esbuild: 0.28.2
  postcss: 8.5.30
  'nanoid@3': 3.3.20
  source-map-js: 1.2.2
  browserslist: 4.29.3
  baseline-browser-mapping: 2.11.29

# Slow down newly published packages long enough for common registry incidents to
# be detected, reject transitive git/tarball sources, and prevent provenance
# downgrades during dependency updates.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
